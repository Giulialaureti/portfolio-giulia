# Pannello di gestione contenuti (Decap CMS), autenticazione via DecapBridge.

backend:
  name: git-gateway
  repo: Giulialaureti/portfolio-giulia
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/7a0e794a-eecf-46cc-9328-64ad747bb74a/pkce
  auth_token_endpoint: /sites/7a0e794a-eecf-46cc-9328-64ad747bb74a/token
  gateway_url: https://gateway.decapbridge.com

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://giulialaureti.netlify.app

media_folder: "assets/img/blog"
public_folder: "/assets/img/blog"

collections:
  - name: "blog"
    label: "Articoli"
    label_singular: "Articolo"
    folder: "blog-src/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Titolo", name: "title", widget: "string" }
      - { label: "Data", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Descrizione breve", name: "description", widget: "text", required: false, hint: "Compare sotto il titolo e nelle anteprime social." }
      - { label: "Immagine di copertina", name: "cover", widget: "image", required: false }
      - { label: "Contenuto", name: "body", widget: "markdown" }
